name: Bug report
description: Report a problem with AI Usage
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For security issues, please don't write in a public issue — use the private reporting process in SECURITY.md instead.
        Do not attach OAuth tokens, Keychain contents, complete JSONL logs, statusline-raw.log, snapshots, or settings.json.

  - type: input
    id: app-version
    attributes:
      label: AI Usage version
      description: Please provide the AI Usage version and build number.
      placeholder: 1.2.3 (45)
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      options:
        - Menu bar
        - Widget
        - Settings
        - Install/update
        - Data collection
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Symptoms and reproduction steps
      description: Please describe the minimal steps to reproduce, excluding secrets, conversation content, and personal paths.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Pre-submission check
      options:
        - label: I have not included OAuth tokens, Keychain contents, raw logs, snapshots, or personal paths.
          required: true
