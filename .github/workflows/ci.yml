name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project generator and search tool
        run: brew install xcodegen ripgrep

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated files and scripts
        run: |
          set -euo pipefail
          git diff --exit-code -- AIUsage.xcodeproj
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          bash scripts/check-localizations.sh
          plutil -lint App/Info.plist

          test ! -e .github/workflows/pages.yml
          rg -F '<link rel="canonical" href="https://moritouch.com/ai-usage">' docs/index.html
          test -s LICENSE
          rg -F 'MIT License' LICENSE
          if rg -n 'arrow\.uturn\.backward|Restore automatic card order' App/UsagePopoverView.swift; then
            echo 'The removed header restore button was reintroduced.' >&2
            exit 1
          fi
          if rg -n 'stalenessText|observedRelativeText|Text\("Updated ' App Widget; then
            echo 'Per-card observation age text was reintroduced.' >&2
            exit 1
          fi
          perl -CSDA -ne '
            if (/\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/) {
              print "$ARGV:$.:$_";
              $invalid = 1;
            }
            close ARGV if eof;
            END { exit($invalid ? 1 : 0) }
          ' scripts/*.sh
          ./scripts/release.sh --help >/dev/null
          ./scripts/prepare-appcast.sh --help >/dev/null
          ./scripts/test-prepare-appcast-staging.sh
          rg -F 'PUBLIC_DOWNLOAD_BASE="$PRODUCT_URL/releases"' scripts/prepare-appcast.sh
          rg -F -- '--download-url-prefix "$PUBLIC_DOWNLOAD_BASE/$TAG/"' scripts/prepare-appcast.sh
          if rg -F 'download-url-prefix "https://github.com/' scripts/prepare-appcast.sh; then
            echo 'Sparkle enclosure downloads must not point at GitHub Release assets.' >&2
            exit 1
          fi
          node --check docs/site.js

      - name: Unit tests
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build with strict concurrency checks
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

      - name: Static analyzer
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsage
          -configuration Debug
          -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          analyze
