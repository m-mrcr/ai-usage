name: AIUsage
options:
  bundleIdPrefix: jp.co.forestx.aiusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

schemes:
  AIUsage:
    build:
      targets:
        AIUsage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIUsageTests

settings:
  base:
    DEVELOPMENT_TEAM: WTKUV8PPM7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.21"
    CURRENT_PROJECT_VERSION: "24"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # Resident menu bar app. Unsandboxed because it reads things like ~/.codex.
  # Writes collection results to the App Group container and passes them to the widget.
  AIUsage:
    type: application
    platform: macOS
    sources:
      - App
      - Resources
      - path: Shared
        excludes:
          - en.lproj
          - ja.lproj
      - Shared/en.lproj/Localizable.strings
      - Shared/ja.lproj/Localizable.strings
    dependencies:
      - target: AIUsageWidget
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.forestx.aiusage
        # Keep the target name as AIUsage, and only give the built product a name with a space.
        # This avoids introducing a space into the scheme name or build paths.
        PRODUCT_NAME: AI Usage
        CODE_SIGN_ENTITLEMENTS: App/AIUsage.entitlements
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 moritouch. Licensed under MIT.
        SUFeedURL: https://moritouch.com/ai-usage/appcast.xml
        SUPublicEDKey: "rUEpVqbT7U1FSjjuxv3WyP4Fqd1WFOqk/71V71fKKs0="
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUScheduledCheckInterval: 86400

  # WidgetKit extension. macOS requires it to be sandboxed, so it never reads
  # logs itself and only renders a snapshot passed via the App Group.
  AIUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      # The widget only has the public snapshot's model and rendering; it never includes Keychain/API/log collectors.
      - Shared/UsageModels.swift
      - Shared/SnapshotStore.swift
      - Shared/UsageFormatting.swift
      - Shared/UsageBar.swift
      - Shared/AppLanguage.swift
      - Shared/en.lproj/Localizable.strings
      - Shared/ja.lproj/Localizable.strings
      # The widget gallery can pull the extension's own icon, so give it the same one as the main app.
      - App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.forestx.aiusage.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Widget/AIUsageWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Usage
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        # The gallery heading picks up this name, so keep it matching the app name.
        CFBundleName: AI Usage
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AIUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/UsageModels.swift
      - Shared/PlanLabel.swift
      - Shared/CodexCollector.swift
      - Shared/CodexAppServer.swift
      - Shared/CLILocator.swift
      - Shared/ClaudeKeychain.swift
      - Shared/KeychainTool.swift
      - Shared/ClaudeSessionKey.swift
      - Shared/WebSessionStore.swift
      - Shared/CursorSession.swift
      - Shared/CursorAPI.swift
      - Shared/CursorCollector.swift
      - Shared/GrokBotCollector.swift
      - Shared/ClaudeWebUsageAPI.swift
      - Shared/ClaudeUsageAPI.swift
      - Shared/ClaudeExtraUsageAPI.swift
      - Shared/ClaudeOAuthRefresher.swift
      - Shared/SnapshotStore.swift
      - Shared/AppLanguage.swift
      - Shared/UsageFormatting.swift
      - Shared/UsageBar.swift
      - Shared/en.lproj/Localizable.strings
      - Shared/ja.lproj/Localizable.strings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.forestx.aiusage.tests
        GENERATE_INFOPLIST_FILE: YES
